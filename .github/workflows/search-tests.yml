name: Search tests

on:
  # Runs on every PR so the required 'golden-queries' check never hangs on PRs that don't touch search files.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'lib/search-*'
      - 'tests/search*'

permissions:
  contents: read

jobs:
  golden-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs public.search_tools() in an in-process Postgres (PGlite) against a catalog snapshot.
      - run: npm run test:search
      - run: npm run test:search:fallback
